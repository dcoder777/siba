  # ═══════════════════════════════════════════════════════════════
  # MODULE 1: INVENTORY (School Consumables & Stationery)
  # ═══════════════════════════════════════════════════════════════

  /inventory/items:
    get:
      tags: [Inventory]
      summary: List inventory items
      description: Retrieve paginated inventory items (school consumables and stationery) with stock alerts.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: q
          description: Search by item name or code
          schema: { type: string, example: "Notebook" }
        - in: query
          name: category
          description: Filter by item category
          schema: { type: string, example: "Stationery" }
      responses:
        '200':
          description: List of inventory items returned successfully
    post:
      tags: [Inventory]
      summary: Create new inventory item
      description: Register a new consumable or stationery inventory item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_name]
              properties:
                item_name: { type: string, example: "A4 Ruled Notebooks (100 Pages)" }
                item_code: { type: string, example: "NB-A4-100" }
                category: { type: string, example: "Stationery" }
                unit: { type: string, example: "Pcs" }
                quantity: { type: number, example: 150 }
                reorder_level: { type: number, example: 25 }
                unit_price: { type: number, example: 45.00 }
                store_location: { type: string, example: "Main Store Room - Rack B" }
      responses:
        '200':
          description: Inventory item created successfully

  /inventory/items/{id}:
    get:
      tags: [Inventory]
      summary: Get inventory item details
      description: Fetch a single inventory item along with its latest 20 stock audit transactions.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Item details with recent transaction log
        '404':
          description: Item not found
    put:
      tags: [Inventory]
      summary: Update inventory item
      description: Update details, pricing, reorder levels, or location of an inventory item.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_name: { type: string, example: "A4 Ruled Notebooks (120 Pages)" }
                category: { type: string, example: "Stationery" }
                unit: { type: string, example: "Pcs" }
                unit_price: { type: number, example: 50.00 }
                reorder_level: { type: number, example: 30 }
                store_location: { type: string, example: "Store Room A - Rack 2" }
      responses:
        '200':
          description: Item updated successfully
    delete:
      tags: [Inventory]
      summary: Delete inventory item
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200':
          description: Item deleted successfully

  /inventory/transactions:
    get:
      tags: [Inventory]
      summary: List stock transactions
      description: Audit log of all stock inbound entries and outbound issues to departments or teachers.
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: item_id
          schema: { type: integer, example: 1 }
        - in: query
          name: type
          schema: { type: string, enum: [Purchase, Issue, Return, Opening, Adjustment], example: "Issue" }
      responses:
        '200':
          description: Stock transactions list
    post:
      tags: [Inventory]
      summary: Record stock issue or stock-in
      description: Record a stock disbursement (Issue) or inbound procurement (Purchase/Opening) with automatic inventory balance update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id, quantity, transaction_type]
              properties:
                item_id: { type: integer, example: 1 }
                transaction_type: { type: string, enum: [Issue, Purchase, Return, Opening], example: "Issue" }
                quantity: { type: number, example: 10 }
                department: { type: string, example: "Primary Wing" }
                issued_to: { type: string, example: "Mrs. Sharma (Grade 3 Class Teacher)" }
                transaction_date: { type: string, format: date, example: "2026-11-16" }
                remarks: { type: string, example: "Classroom craft supplies" }
      responses:
        '200':
          description: Transaction recorded and inventory balance adjusted

