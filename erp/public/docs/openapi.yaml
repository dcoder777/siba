openapi: 3.0.3
info:
  title: SIBA School ERP API
  version: 1.0.0
  description: >
    API-first School ERP backend for web and mobile apps.
    
    The site (public website & parent portal) and ERP now share a single database (`siba_erp`).
    Site tables (parents, admins, applications, fees, cms_pages, settings, notifications, staff)
    coexist in the same database as ERP tables, with FK links between them.

    ## Authentication
    All endpoints (except `/health`, `/auth/login`, and `/admissions/register-parent`) require a Bearer token.
    
    **Development Token (DEV ONLY):**
    ```
    Authorization: Bearer siba-dev-static-token-2026
    ```
    Run `php erp/public/dev-token.php` once to insert it into the database.
    
    **Production:** Use `POST /api/v1/auth/login` to obtain a token.
    
    ## Pagination
    All list endpoints accept `page` (default 1) and `limit` (default 20, max 100) query parameters.
    
    ## Response Format
    All responses follow: `{ success: bool, message: string, data: {...} }`
servers:
  - url: http://localhost/siba/erp/public/api/v1
    description: Local Development
  - url: https://sibapublicschool.com/erp/public/api/v1
    description: Production
tags:
  - name: Auth
  - name: Admissions
  - name: Students
  - name: Parents
  - name: Academics
  - name: Finance
  - name: Operations
  - name: HR
  - name: Reports
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
        data:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error description
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        total_pages:
          type: integer
          example: 5
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and get API token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@siba.local
                password:
                  type: string
                  example: Password@123
              example:
                email: admin@siba.local
                password: Password@123
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'

  /admissions/register-parent:
    post:
      tags: [Admissions]
      summary: Register a new parent account only (no application)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
                - email
                - password
              properties:
                name:
                  type: string
                  example: Rajesh Sharma
                  description: Parent's full name
                phone:
                  type: string
                  example: "9876543210"
                  description: 10-digit mobile number
                email:
                  type: string
                  format: email
                  example: rajesh.sharma@example.com
                  description: Parent email address
                password:
                  type: string
                  example: Password@123
                  description: Account password
              example:
                name: Rajesh Sharma
                phone: "9876543210"
                email: rajesh.sharma@example.com
                password: Password@123
      responses:
        '200':
          description: Parent registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /admissions/applications:
    get:
      tags: [Admissions]
      summary: List admission applications
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: q
          schema: { type: string, example: Sharma }
          description: Search by student name, father name, mother name, parent name, or phone
        - in: query
          name: status
          schema: { type: string, example: "Application started" }
          description: Filter by status (Application started, Under review, Admitted, Rejected)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      applications:
                        type: array
                        items:
                          type: object
                      pagination:
                        $ref: '#/components/schemas/Pagination'

  /admissions/apply:
    post:
      tags: [Admissions]
      summary: Submit a new admission application with document file uploads
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - student_name
                - dob
                - class_sought
                - father_name
                - mother_name
              properties:
                name:
                  type: string
                  example: Rajesh Sharma
                  description: Parent full name (required if creating new parent)
                phone:
                  type: string
                  example: "9876543210"
                  description: 10-digit mobile number
                email:
                  type: string
                  format: email
                  example: rajesh.sharma@example.com
                  description: Parent email address
                password:
                  type: string
                  example: Password@123
                  description: Account password (required if creating new parent)
                parent_id:
                  type: integer
                  example: 1
                  description: Existing parent ID (if already registered)
                student_name:
                  type: string
                  example: Aarav Sharma
                  description: Full name of the student
                first_name:
                  type: string
                  example: Aarav
                middle_name:
                  type: string
                  example: Kumar
                last_name:
                  type: string
                  example: Sharma
                dob:
                  type: string
                  format: date
                  example: "2018-05-15"
                  description: Date of birth (YYYY-MM-DD)
                gender:
                  type: string
                  enum: [Male, Female, Other]
                  example: Male
                religion:
                  type: string
                  example: Hindu
                blood_group:
                  type: string
                  example: B+
                aadhaar_no:
                  type: string
                  example: "123456789012"
                caste:
                  type: string
                  enum: [General, OBC, SC, ST, Other]
                  example: General
                disability:
                  type: string
                  enum: [Yes, No]
                  example: "No"
                disability_details:
                  type: string
                  example: None
                previous_school:
                  type: string
                  example: Sunrise Public School
                previous_class:
                  type: string
                  example: UKG
                class_sought:
                  type: string
                  example: Class 1
                  description: Class applying for (e.g. Nursery, UKG, Class 1)
                address_line1:
                  type: string
                  example: Flat 402, Green Valley Apartments
                address_line2:
                  type: string
                  example: Near City Park
                post_office:
                  type: string
                  example: Central Post Office
                police_station:
                  type: string
                  example: Town PS
                district:
                  type: string
                  example: Kolkata
                village_city:
                  type: string
                  example: Kolkata
                pin:
                  type: string
                  example: "700001"
                state:
                  type: string
                  example: West Bengal
                country:
                  type: string
                  default: India
                  example: India
                father_name:
                  type: string
                  example: Rajesh Sharma
                father_occupation:
                  type: string
                  example: Software Engineer
                father_aadhaar_no:
                  type: string
                  example: "987654321098"
                father_voter_no:
                  type: string
                  example: WB/01/123456
                mother_name:
                  type: string
                  example: Pooja Sharma
                mother_occupation:
                  type: string
                  example: Teacher
                mother_aadhaar_no:
                  type: string
                  example: "456789123456"
                mother_voter_no:
                  type: string
                  example: WB/01/654321
                guardian_name:
                  type: string
                  example: Rajesh Sharma
                guardian_occupation:
                  type: string
                  example: Software Engineer
                family_annual_income:
                  type: string
                  example: Above 8 Lakhs
                contact_no:
                  type: string
                  example: "9876543210"
                address:
                  type: string
                  example: Flat 402, Green Valley Apartments, Kolkata, 700001
                birth_cert:
                  type: string
                  format: binary
                  description: Student Birth Certificate (JPG, PNG, WEBP, PDF)
                aadhaar:
                  type: string
                  format: binary
                  description: Student Aadhaar Card Copy (JPG, PNG, WEBP, PDF)
                leaving_cert:
                  type: string
                  format: binary
                  description: Transfer / School Leaving Certificate (TC/LC)
                prev_marksheet:
                  type: string
                  format: binary
                  description: Previous Class Marksheet
                photo:
                  type: string
                  format: binary
                  description: Student Passport Photo (JPG, PNG, WEBP)
                caste_cert:
                  type: string
                  format: binary
                  description: Caste Certificate (if applicable)
                father_photo:
                  type: string
                  format: binary
                  description: Father Passport Photo (JPG, PNG, WEBP)
                mother_photo:
                  type: string
                  format: binary
                  description: Mother Passport Photo (JPG, PNG, WEBP)
                father_aadhaar:
                  type: string
                  format: binary
                  description: Father Aadhaar Card Copy
                mother_aadhaar:
                  type: string
                  format: binary
                  description: Mother Aadhaar Card Copy
                father_voter:
                  type: string
                  format: binary
                  description: Father Voter ID Card Copy
                mother_voter:
                  type: string
                  format: binary
                  description: Mother Voter ID Card Copy
                disability_cert:
                  type: string
                  format: binary
                  description: Disability Certificate (if applicable)
                guardian_signature:
                  type: string
                  format: binary
                  description: Parent / Guardian Signature (JPG, PNG, WEBP)
      responses:
        '200':
          description: Application submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Application submitted successfully }
                  data:
                    type: object
                    properties:
                      application_no: { type: string, example: "SBA-2026-0001" }
                      parent_id: { type: integer, example: 1 }
                      application_id: { type: integer, example: 1 }
                      user_id: { type: integer, example: 2 }
                      uploaded_files:
                        type: object
                        example:
                          birth_cert: "1728740000_bc_birth.pdf"
                          photo: "1728740000_ph_photo.jpg"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /students:
    get:
      tags: [Students]
      summary: List students
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: q
          schema: { type: string, example: Aarav }
        - in: query
          name: class_name
          schema: { type: string, example: "Class 1" }
        - in: query
          name: status
          schema: { type: string, example: active }
      responses:
        '200': { description: OK }
    post:
      tags: [Students]
      summary: Create student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admission_no, first_name, last_name]
              properties:
                admission_no: { type: string, example: "ADM-2026-001" }
                first_name: { type: string, example: Aarav }
                last_name: { type: string, example: Sharma }
                gender: { type: string, example: Male }
                dob: { type: string, format: date, example: "2018-05-15" }
                phone: { type: string, example: "9876543210" }
                email: { type: string, example: aarav.student@siba.local }
              example:
                admission_no: "ADM-2026-001"
                first_name: Aarav
                last_name: Sharma
                gender: Male
                dob: "2018-05-15"
                phone: "9876543210"
                email: aarav.student@siba.local
      responses:
        '200': { description: Created }

  /students/{id}:
    get:
      tags: [Students]
      summary: Get student by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: OK }
    put:
      tags: [Students]
      summary: Update student
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string, example: Aarav }
                last_name: { type: string, example: Sharma }
                gender: { type: string, example: Male }
                dob: { type: string, format: date, example: "2018-05-15" }
                phone: { type: string, example: "9876543210" }
                email: { type: string, example: aarav.student@siba.local }
              example:
                first_name: Aarav
                last_name: Sharma
                gender: Male
                dob: "2018-05-15"
                phone: "9876543210"
                email: aarav.student@siba.local
      responses:
        '200': { description: Updated }
    delete:
      tags: [Students]
      summary: Delete student
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: Deleted }

  /students/attendance:
    get:
      tags: [Students]
      summary: List attendance
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: student_id
          schema: { type: integer, example: 1 }
        - in: query
          name: date
          schema: { type: string, format: date, example: "2026-10-12" }
      responses:
        '200': { description: OK }
    post:
      tags: [Students]
      summary: Create or update attendance by date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id, date, status]
              properties:
                student_id: { type: integer, example: 1 }
                date: { type: string, format: date, example: "2026-10-12" }
                status: { type: string, example: present }
                remark: { type: string, example: "Present on time" }
              example:
                student_id: 1
                date: "2026-10-12"
                status: present
                remark: "Present on time"
      responses:
        '200': { description: Saved }

  /students/attendance/{id}:
    put:
      tags: [Students]
      summary: Update attendance record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, example: present }
                remark: { type: string, example: "Updated remark" }
              example:
                status: present
                remark: "Updated remark"
      responses:
        '200': { description: Updated }
    delete:
      tags: [Students]
      summary: Delete attendance
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: Deleted }

  /students/lifecycle:
    get:
      tags: [Students]
      summary: List lifecycle records
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: student_id
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: OK }
    post:
      tags: [Students]
      summary: Create lifecycle record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id, class_name, session_label, status]
              properties:
                student_id: { type: integer, example: 1 }
                class_name: { type: string, example: "Class 1" }
                section_name: { type: string, example: "A" }
                session_label: { type: string, example: "2026-2027" }
                status: { type: string, example: enrolled }
              example:
                student_id: 1
                class_name: "Class 1"
                section_name: "A"
                session_label: "2026-2027"
                status: enrolled
      responses:
        '200': { description: Created }

  /students/lifecycle/{id}:
    put:
      tags: [Students]
      summary: Update lifecycle record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                class_name: { type: string, example: "Class 1" }
                section_name: { type: string, example: "B" }
                session_label: { type: string, example: "2026-2027" }
                status: { type: string, example: promoted }
              example:
                class_name: "Class 1"
                section_name: "B"
                session_label: "2026-2027"
                status: promoted
      responses:
        '200': { description: Updated }
    delete:
      tags: [Students]
      summary: Delete lifecycle record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: Deleted }

  /parents:
    get:
      tags: [Parents]
      summary: List all parents
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: q
          schema: { type: string, example: Sharma }
          description: Search by name, email, or phone
      responses:
        '200': { description: OK }

  /parents/{id}:
    get:
      tags: [Parents]
      summary: Get parent by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: OK }
    put:
      tags: [Parents]
      summary: Update parent details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Rajesh Sharma }
                email: { type: string, example: rajesh.sharma@example.com }
                phone: { type: string, example: "9876543210" }
              example:
                name: Rajesh Sharma
                email: rajesh.sharma@example.com
                phone: "9876543210"
      responses:
        '200': { description: Updated }

  /parents/{id}/applications:
    get:
      tags: [Parents]
      summary: List applications for a parent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
      responses:
        '200': { description: OK }

  /academics/subjects:
    get:
      tags: [Academics]
      summary: List subjects
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: q
          schema: { type: string, example: Mathematics }
        - in: query
          name: class_name
          schema: { type: string, example: "Class 1" }
      responses:
        '200': { description: OK }
    post:
      tags: [Academics]
      summary: Create subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_code, subject_name, class_name]
              properties:
                subject_code: { type: string, example: "MATH-101" }
                subject_name: { type: string, example: Mathematics }
                class_name: { type: string, example: "Class 1" }
              example:
                subject_code: "MATH-101"
                subject_name: Mathematics
                class_name: "Class 1"
      responses:
        '200': { description: Created }

  /academics/subjects/{id}:
    put:
      tags: [Academics]
      summary: Update subject
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject_code: { type: string, example: "MATH-101" }
                subject_name: { type: string, example: "Advanced Mathematics" }
                class_name: { type: string, example: "Class 1" }
              example:
                subject_code: "MATH-101"
                subject_name: "Advanced Mathematics"
                class_name: "Class 1"
      responses:
        '200': { description: Updated }
    delete:
      tags: [Academics]
      summary: Delete subject
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: Deleted }

  /academics/exam-results:
    get:
      tags: [Academics]
      summary: List exam results
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1, example: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20, example: 20 }
        - in: query
          name: student_id
          schema: { type: integer, example: 1 }
        - in: query
          name: subject_id
          schema: { type: integer, example: 1 }
        - in: query
          name: exam_name
          schema: { type: string, example: "Mid-Term" }
      responses:
        '200': { description: OK }
    post:
      tags: [Academics]
      summary: Create exam result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_id, subject_id, exam_name, marks_obtained, max_marks]
              properties:
                student_id: { type: integer, example: 1 }
                subject_id: { type: integer, example: 1 }
                exam_name: { type: string, example: "Mid-Term Exam" }
                marks_obtained: { type: number, example: 88.5 }
                max_marks: { type: number, example: 100 }
                remarks: { type: string, example: "Excellent performance" }
              example:
                student_id: 1
                subject_id: 1
                exam_name: "Mid-Term Exam"
                marks_obtained: 88.5
                max_marks: 100
                remarks: "Excellent performance"
      responses:
        '200': { description: Created }

  /academics/exam-results/{id}:
    put:
      tags: [Academics]
      summary: Update exam result
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                marks_obtained: { type: number, example: 92.0 }
                max_marks: { type: number, example: 100 }
                remarks: { type: string, example: "Updated score after re-check" }
              example:
                marks_obtained: 92.0
                max_marks: 100
                remarks: "Updated score after re-check"
      responses:
        '200': { description: Updated }
    delete:
      tags: [Academics]
      summary: Delete exam result
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, example: 1 }
      responses:
        '200': { description: Deleted }

  /academics/assignments:
